[project]
name = "ms-stock-price-prediction"
version = "0.1.0"
description = "Compare LSTM and GRU models for next-day Microsoft stock price prediction."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ipykernel>=7.0.0",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.6.0",
    "torch>=2.7.0",
    "yfinance>=0.2.0",
]

[project.scripts]
download-msft-data = "ms_stock_prediction.data:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
